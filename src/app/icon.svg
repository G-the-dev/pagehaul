<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark alone, on nothing: a lowercase p built from the grid's own
    tiles, checker-shaded, with the last tile missing - the one you took.
    No background square; a solid tile fought the tab strip in whichever
    theme it did not match. Grey tiles read on both, a step darker on a
    light strip, a step lighter on a dark one.

    The glyph is inset well clear of every edge. Favicon renderers scale
    and round harshly, and a row that touches the box is a row that gets
    shaved at somebody's zoom level.
  -->
  <style>
    .tile { fill: #52525b; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #d4d4d8; }
    }
  </style>

  <rect class="tile" x="7.5" y="2.5" width="7" height="7" rx="2" />
  <rect class="tile" x="17.5" y="2.5" width="7" height="7" rx="2" opacity="0.5" />
  <rect class="tile" x="7.5" y="12.5" width="7" height="7" rx="2" opacity="0.5" />
  <rect class="tile" x="17.5" y="12.5" width="7" height="7" rx="2" />
  <rect class="tile" x="7.5" y="22.5" width="7" height="7" rx="2" />
</svg>
