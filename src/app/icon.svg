<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark is a lowercase p built from the grid's own tiles: five rounded
    squares in a 2x3 matrix, checker-shaded like the transparency board that
    sits behind every image in the product, with the last tile missing.
    That gap is the point - it is the file you took.

    The colours invert with the browser's theme, because a tab strip is light
    in one and near black in the other, and a fixed dark square disappears
    against a dark strip.
  -->
  <style>
    .bg { fill: #0a0a0a; }
    .tile { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #fafafa; }
      .tile { fill: #0a0a0a; }
    }
  </style>

  <rect class="bg" width="32" height="32" rx="7" />

  <rect class="tile" x="9" y="5" width="6" height="6" rx="1.5" />
  <rect class="tile" x="17" y="5" width="6" height="6" rx="1.5" opacity="0.5" />
  <rect class="tile" x="9" y="13" width="6" height="6" rx="1.5" opacity="0.5" />
  <rect class="tile" x="17" y="13" width="6" height="6" rx="1.5" />
  <rect class="tile" x="9" y="21" width="6" height="6" rx="1.5" />
</svg>
