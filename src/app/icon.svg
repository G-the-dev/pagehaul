<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark alone, on nothing: a lowercase p built from the grid's own
    tiles, checker-shaded, with the last tile missing - the one you took.
    There is no background square any more; a solid tile fought the tab
    strip in whichever theme it did not match. Grey tiles read on both.

    The grey shifts one step with the browser theme so it stays legible:
    darker on a light strip, lighter on a dark one. A pixel of margin at
    the top and bottom keeps renderers that round harshly from shaving
    the outer rows.
  -->
  <style>
    .tile { fill: #52525b; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #d4d4d8; }
    }
  </style>

  <rect class="tile" x="6.5" y="1" width="8" height="8" rx="2" />
  <rect class="tile" x="17.5" y="1" width="8" height="8" rx="2" opacity="0.5" />
  <rect class="tile" x="6.5" y="12" width="8" height="8" rx="2" opacity="0.5" />
  <rect class="tile" x="17.5" y="12" width="8" height="8" rx="2" />
  <rect class="tile" x="6.5" y="23" width="8" height="8" rx="2" />
</svg>
