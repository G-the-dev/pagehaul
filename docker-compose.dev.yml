# Just the pieces the app needs to run locally. The full production compose
# file (web, worker, caddy) arrives in step 6.
services:
  redis:
    image: redis:7-alpine
    container_name: pagehaul-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
